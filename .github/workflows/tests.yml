name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autopr
          POSTGRES_PASSWORD: autopr
          POSTGRES_DB: autopr
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://autopr:autopr@localhost:5432/autopr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      # Evals run on replay: no API key, no network, no cost. The runner exits
      # non-zero when a case's state does not match its expectation, so this
      # step is the quality gate - it must not be allowed to pass on failure.
      - run: python -m evals.runner
