services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autopr
      POSTGRES_PASSWORD: autopr
      POSTGRES_DB: autopr
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopr"]
      interval: 3s
      retries: 10

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autopr:autopr@db:5432/autopr
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: .
    command: python -m worker.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autopr:autopr@db:5432/autopr
    depends_on:
      db: {condition: service_healthy}
    # The whole point of Postgres + SKIP LOCKED: this number can go up.
    deploy:
      replicas: 1

volumes:
  pgdata:
