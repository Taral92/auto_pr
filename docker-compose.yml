services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autopr
      POSTGRES_PASSWORD: autopr
      POSTGRES_DB: autopr
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopr"]
      interval: 3s
      retries: 10

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://autopr:autopr@db:5432/autopr}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: .
    command: python -m worker.main
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://autopr:autopr@db:5432/autopr}
    depends_on:
      db: {condition: service_healthy}
    # The whole point of Postgres + SKIP LOCKED: this number can go up.
    deploy:
      replicas: 1
    # Deliberately NO volume for /app/runs. The LangGraph checkpoint DB there
    # is container-local scratch: the worker deletes each thread when its
    # review returns and sweeps the rest at boot, so it stays small and nothing
    # in it is worth keeping. Mounting it - especially shared between replicas -
    # would turn that into a permanent store and put concurrent writers on one
    # SQLite file (WAL, busy_timeout 5s), where a slow write surfaces as
    # "database is locked" and fails a review. Durable state is Postgres.

volumes:
  pgdata:
