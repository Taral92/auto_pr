[pytest]
# The packages under test - agent, core, gh, storage, api, worker, evals - and
# config.py live at the repository root, and nothing installs them: the README
# and the Dockerfile both use `pip install -r requirements.txt`, not `pip
# install -e .`. So they import only when the root is on sys.path.
#
# Nothing here put it there. `python -m pytest` worked by accident - `-m`
# prepends the working directory - while bare `pytest` did not: the console
# script does not add the cwd, and pytest's prepend import mode inserts each
# test module's basedir, which is `tests/` (it has no __init__.py) and not the
# root. Every root-level import then failed at collection. CI invokes it the
# bare way, so the two disagreed about whether this suite passed.
#
# `pythonpath` states the requirement instead. Having any config file here also
# pins rootdir to this directory rather than leaving it inferred from argv.
pythonpath = .
